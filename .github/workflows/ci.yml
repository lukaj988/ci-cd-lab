name: CI/CD Pipeline

on:
  push:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
       - uses: actions/checkout@v4

       - name: Run health Check
         run: |
           chmod +x scripts/backup.sh
           ./scripts/backup.sh

       - name: Test Backup Script
         run: |
           chmod +x scripts/backup.sh
           ./scripts/backup.sh

       - name: Docker Login
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKER_USERNAME }}
           password: ${{ secrets.DOCKER_PASSWORD }}

       - name: Build Image
         run: |
           docker build -t lukaj988/luka-nginx:latest .

       - name: Push Image
         run: |
           docker push lukaj988/luka-nginx:latest
