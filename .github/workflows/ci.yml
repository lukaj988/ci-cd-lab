name: CI Pipeline

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Give permision
        run: chmod +x scripts/health.sh

      - name: Run Health Script
        run: ./scripts/health.sh

      - name: Build Docker Image
        run: docker build -t test-image .
