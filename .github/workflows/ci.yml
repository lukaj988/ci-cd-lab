name: CI Pipeline

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Health Script
        run: |
          chmod +x scripts/health.sh
          ./scripts/health.sh

      - name: Build Docker Image
        run: |
           docker build -t luka-nginx:v1 .
